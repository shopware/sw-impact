name: Release CLI

on:
  push:
    branches:
      - trunk

permissions:
  contents: write

concurrency:
  group: release-sw-impact
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Read version
        id: version
        run: |
          version="$(awk -F'"' '/^version = / { print $2; exit }' crates/sw-impact/Cargo.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.release.outputs.exists == 'false'
        run: cargo build --locked --release -p sw-impact

      - name: Package
        if: steps.release.outputs.exists == 'false'
        run: |
          mkdir -p dist
          cp target/release/sw-impact dist/sw-impact
          tar -czf dist/sw-impact-x86_64-unknown-linux-gnu.tar.gz -C dist sw-impact

      - name: Create release
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            dist/sw-impact-x86_64-unknown-linux-gnu.tar.gz \
            --target "$GITHUB_SHA" \
            --title "sw-impact $TAG" \
            --generate-notes

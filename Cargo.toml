[package]
name = "sw-impact"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
aho-corasick = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
quick-xml = "0.38"
rayon = "1"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.25"
tree-sitter-php = "0.24"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[package]
name = "sw-impact-scanner"
version = "0.1.0"
edition = "2024"

[dependencies]
ignore = "0.4.25"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tracing = "0.1.44"
tree-sitter = "0.26.9"
tree-sitter-javascript = "0.25.0"
tree-sitter-php = "0.24.2"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
insta = { version = "1.48.0", features = ["json", "yaml"] }

